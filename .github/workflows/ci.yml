name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job per platform, compiling the workspace exactly once.
  #
  # The ncdu assertions live here rather than in a separate job on purpose: a
  # standalone job would need its own runner and its own cache, so each platform
  # would build the whole workspace twice for no gain.
  rust:
    name: rust / ${{ matrix.label }}
    # macOS beta focus: Linux and Windows matrix entries are preserved below as
    # comments. Uncomment them after the beta to restore cross-platform CI.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Temporarily disabled for the macOS beta:
          # - os: ubuntu-latest
          #   label: ubuntu (ncdu 1.x from apt)
          #   lint: true
          #   generated: true
          #   ncdu_install: sudo apt-get update && sudo apt-get install -y ncdu
          #   ncdu_expect: unsupported
          # - os: ubuntu-latest
          #   label: ubuntu (ncdu 2.x from upstream)
          #   lint: false
          #   ncdu_install: curl -fsSL https://dev.yorhel.nl/download/ncdu-2.9.1-linux-x86_64.tar.gz | sudo tar -xz -C /usr/local/bin ncdu
          #   ncdu_expect: ok
          # Homebrew ships ncdu 2.x.
          - os: macos-latest
            label: macos
            lint: true
            generated: true
            ncdu_install: brew install ncdu
            ncdu_expect: ok
          # Temporarily disabled for the macOS beta:
          # - os: windows-latest
          #   label: windows
          #   lint: true
          #   ncdu_expect: skip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1

      # The Tauri shell links against the system webview. macOS and Windows ship
      # one; on Linux it is a package, and without it the whole workspace stops
      # compiling here rather than in the one crate that needs it.
      - name: Install the Linux webview toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install gdu 5.32.0 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gdu.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'gdu'
          Invoke-WebRequest `
            -Uri 'https://github.com/dundee/gdu/releases/download/v5.32.0/gdu_windows_amd64.exe.zip' `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $directory
          Move-Item `
            (Join-Path $directory 'gdu_windows_amd64.exe') `
            (Join-Path $directory 'gdu.exe')
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # rip is the only backend with scriptable selected-path deletion and
      # exact undo. It is Unix-only upstream, so Windows still compiles the
      # adapter and honestly reports it missing.
      - name: Install rip 0.13.1
        if: runner.os != 'Windows'
        run: |
          cargo install rm-improved --version 0.13.1 --locked
          echo "NIRMOKA_RIP_BIN=$(command -v rip)" >> "$GITHUB_ENV"

      # Lint once per platform. The second Linux entry exists for its backend,
      # not to run clippy again on the same source.
      - name: Format
        if: matrix.lint
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Deliberately without `--all-targets`, so this compiles lib and bin
      # targets only. A panic is how a test asserts; in shipping code it is how
      # a disk tool dies holding someone's file. The count is zero today, which
      # is what makes this a ratchet rather than a cleanup task.
      - name: No unwrap in shipping code
        if: matrix.lint
        run: cargo clippy --workspace -- -D clippy::unwrap_used

      - name: Check
        run: cargo check --workspace --all-targets

      # Includes tests/contract, which is fixture-driven and needs no backend,
      # and regenerates the TypeScript bindings as a side effect.
      - name: Test
        run: cargo test --workspace

      # The generated types are committed so the frontend builds without a Rust
      # toolchain. That only stays true if a changed Rust type cannot merge
      # without its mirror — the tests above have already rewritten the file, so
      # a diff here means someone edited a DTO and did not regenerate.
      - name: Generated types are current
        if: matrix.generated
        run: |
          if ! git diff --exit-code -- packages/transport/src/generated; then
            echo "::error::run \`pnpm types\` and commit the result"
            exit 1
          fi

      # Runs everywhere, including Windows: the parser and the whole CLI path
      # are exercised against recorded output with no backend installed.
      - name: Scan a recorded export
        shell: bash
        run: |
          cargo run -q -p nirmoka-cli -- \
            scan --from-export fixtures/ncdu/2.8.2/simple.json --json > scan.json
          cat scan.json

          # The awkward cases the fixture was recorded for. A parser that
          # silently stopped deduplicating hardlinks would still exit zero.
          grep -q '"hardlinksDeduplicated": 1' scan.json ||
            { echo "::error::hardlink deduplication is not reaching the CLI"; exit 1; }
          grep -q '"readErrors": 1' scan.json ||
            { echo "::error::read errors are not reaching the CLI"; exit 1; }

      - name: Install ncdu
        if: matrix.ncdu_expect != 'skip'
        run: ${{ matrix.ncdu_install }}

      - name: Report installed ncdu
        if: matrix.ncdu_expect != 'skip'
        run: ncdu --version

      # `backends` exits non-zero when nothing usable is found. Once rip is
      # installed, an unsupported ncdu no longer implies that exit status, so
      # version-gate assertions inspect ncdu's own row rather than conflating
      # one backend's state with the whole registry.
      - name: Detect backends
        if: matrix.ncdu_expect != 'skip'
        shell: bash
        run: |
          set +e
          output=$(cargo run -q -p nirmoka-cli -- backends)
          status=$?
          set -e

          printf '%s\n' "$output"
          echo "exit status: $status"

          case "${{ matrix.ncdu_expect }}" in
            ok)
              if [ "$status" -ne 0 ]; then
                echo "::error::expected a usable backend, got exit $status"
                exit 1
              fi
              if ! printf '%s' "$output" | grep -qE '^ncdu +ok +2\.'; then
                echo "::error::expected ncdu reported as ok at 2.x"
                exit 1
              fi
              # Detection must name the binary that will run, not the command
              # name it hoped to find. The `yes` between them is the SCANS
              # column: a scanner that stopped declaring the ability would
              # leave the window with a button and nothing behind it.
              if ! printf '%s' "$output" | grep -qE '^ncdu +ok +2\.[^ ]* +yes +/'; then
                echo "::error::expected ncdu to declare scan and report an absolute path"
                exit 1
              fi
              ;;
            unsupported)
              if ! printf '%s' "$output" | grep -qE '^ncdu +unsupported +1\.'; then
                echo "::error::expected ncdu 1.x reported as unsupported"
                exit 1
              fi
              ;;
          esac

      # Mole is macOS-only and absent from every runner, but the capability is
      # a static declaration rather than a detection result — so this holds on
      # all three platforms, and fails if the adapter ever starts claiming it
      # can scan. See docs/adr/0012-mole-is-not-a-scanner.md.
      - name: A backend that cannot scan says so
        if: matrix.ncdu_expect != 'skip'
        shell: bash
        run: |
          output=$(cargo run -q -p nirmoka-cli -- backends || true)
          printf '%s\n' "$output"

          if ! printf '%s' "$output" | grep -qE '^mole +[a-z]+ +[^ ]+ +no( |$)'; then
            echo "::error::mole must report no in the SCANS column"
            exit 1
          fi

      # A preference is not an override. Choosing a backend that cannot do the
      # job has to fall back and say so, rather than failing the operation — the
      # decision in docs/adr/0013-the-backend-is-a-choice.md, asserted against
      # the binary instead of left in prose.
      #
      # `mole` is the argument on every platform on purpose: it is usable and
      # cannot scan on macOS, and not installed at all elsewhere. Both are
      # fallbacks, and the same two lines have to come out either way.
      - name: A preferred backend that cannot do the job falls back
        if: matrix.ncdu_expect == 'ok'
        shell: bash
        run: |
          output=$(cargo run -q -p nirmoka-cli -- --backend mole backends)
          printf '%s\n' "$output"

          if ! printf '%s' "$output" | grep -qE '^SCANS WITH +ncdu$'; then
            echo "::error::preferring mole must leave ncdu scanning, not break the scan"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -qE '^PREFERRED +mole,'; then
            echo "::error::a preference that was not met must be named, not silently dropped"
            exit 1
          fi

      # The other half: the fallback is not just reported, it actually runs.
      - name: A scan runs even when the preferred backend cannot scan
        if: matrix.ncdu_expect == 'ok'
        shell: bash
        run: |
          output=$(cargo run -q -p nirmoka-cli -- --backend mole scan crates/core --depth 1 2>&1)
          printf '%s\n' "$output"

          if ! printf '%s' "$output" | grep -q 'mole was preferred'; then
            echo "::error::the substitution must be stated, not silent"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -qE '^SOURCE +ncdu'; then
            echo "::error::the scan must have actually run on ncdu"
            exit 1
          fi

      - name: Detect backends as JSON
        if: matrix.ncdu_expect != 'skip'
        shell: bash
        run: cargo run -q -p nirmoka-cli -- backends --json || true

      - name: Detect and scan with gdu on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          gdu --version
          output=$(cargo run -q -p nirmoka-cli -- backends)
          printf '%s\n' "$output"

          if ! printf '%s' "$output" | grep -qE '^gdu +ok +5\.32\.[^ ]* +yes +[A-Za-z]:\\'; then
            echo "::error::expected supported gdu at an absolute Windows path"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -qE '^SCANS WITH +gdu$'; then
            echo "::error::Windows must select gdu as its scanner"
            exit 1
          fi

          cargo run -q -p nirmoka-cli -- scan crates/core --depth 1 --limit 10

      # The end-to-end path: a real backend, as a subprocess, streamed into a
      # core tree, with no GUI framework in the dependency graph.
      - name: Scan a real directory
        if: matrix.ncdu_expect == 'ok'
        shell: bash
        run: |
          cargo run -q -p nirmoka-cli -- scan . --depth 1 --limit 10
          cargo run -q -p nirmoka-cli -- scan . --json --depth 1 --limit 3 > live.json
          grep -q '"totalBytes"' live.json ||
            { echo "::error::a live scan produced no totals"; exit 1; }

      # An unsupported backend must refuse to scan, not scan anyway. ncdu 1.x
      # emits the same JSON format *major* version as 2.x, so an ungated parse
      # would succeed and produce plausible numbers from an untested tool.
      - name: Refuse to scan with an unsupported backend
        if: matrix.ncdu_expect == 'unsupported'
        shell: bash
        run: |
          set +e
          output=$(cargo run -q -p nirmoka-cli -- scan . 2>&1)
          status=$?
          set -e

          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::scanned with an unsupported backend"
            exit 1
          fi

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build

  # Licences and advisories. A separate job because it reads Cargo.lock rather
  # than building anything, and because its most important assertion is not
  # about this platform: NOTICE.md and AGENTS.md both forbid Nirmoka becoming a
  # derivative work of a GPL backend, and `deny.toml`'s allow-list is what turns
  # that from a rule people remember into a build failure.
  supply-chain:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # Architectural invariants. The checks live in scripts/check-invariants.sh so
  # that this job and the pre-push hook run the exact same code and cannot drift.
  invariants:
    name: architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-invariants.sh
