name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job per platform, compiling the workspace exactly once.
  #
  # The ncdu detection assertions live here rather than in a separate job on
  # purpose: a standalone job would need its own runner and its own cache, so
  # ubuntu and macos would each build the whole workspace twice for no gain.
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 still ships the ncdu 1.x series, which emits a
          # different JSON export shape. That makes this runner a free
          # real-world test that the version gate rejects it.
          - os: ubuntu-latest
            ncdu_install: sudo apt-get update && sudo apt-get install -y ncdu
            ncdu_expect: unsupported
          # Homebrew ships ncdu 2.x, so this is the usable-backend case.
          - os: macos-latest
            ncdu_install: brew install ncdu
            ncdu_expect: ok
          # ncdu has no Windows build — it is a curses application. gdu is the
          # planned Windows backend (roadmap step 11), so this platform only
          # proves the workspace compiles and its tests pass.
          - os: windows-latest
            ncdu_expect: skip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Install ncdu
        if: matrix.ncdu_expect != 'skip'
        run: ${{ matrix.ncdu_install }}

      - name: Report installed ncdu
        if: matrix.ncdu_expect != 'skip'
        run: ncdu --version

      # `backends` exits non-zero when nothing usable is found, so the exit
      # code is asserted explicitly per platform rather than assumed. This is
      # also the proof that the whole stack runs with no display server.
      - name: Detect backends
        if: matrix.ncdu_expect != 'skip'
        shell: bash
        run: |
          set +e
          output=$(cargo run -q -p nirmoka-cli -- backends)
          status=$?
          set -e

          printf '%s\n' "$output"
          echo "exit status: $status"

          case "${{ matrix.ncdu_expect }}" in
            ok)
              if [ "$status" -ne 0 ]; then
                echo "::error::expected a usable backend, got exit $status"
                exit 1
              fi
              if ! printf '%s' "$output" | grep -qE '^ncdu +ok +2\.'; then
                echo "::error::expected ncdu reported as ok at 2.x"
                exit 1
              fi
              ;;
            unsupported)
              if [ "$status" -eq 0 ]; then
                echo "::error::ncdu 1.x must not be accepted — the version gate failed"
                exit 1
              fi
              if ! printf '%s' "$output" | grep -q 'unsupported'; then
                echo "::error::expected ncdu reported as unsupported"
                exit 1
              fi
              ;;
          esac

      - name: Detect backends as JSON
        if: matrix.ncdu_expect != 'skip'
        shell: bash
        run: cargo run -q -p nirmoka-cli -- backends --json || true

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build

  # Architectural invariants. The checks live in scripts/check-invariants.sh so
  # that this job and the pre-push hook run the exact same code and cannot drift.
  invariants:
    name: architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-invariants.sh
