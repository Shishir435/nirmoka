name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cross-platform from step 0. Only `check` and `test` — building the GUI on
  # three platforms comes later. The point right now is that a compile break on
  # Linux or Windows is caught for free while developing on a Mac.
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # The headless harness must work against a real backend, with no display
  # server anywhere. Two runners because they give two genuinely different
  # backends, and both outcomes need asserting.
  nrmk:
    name: nrmk / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 still ships the ncdu 1.x series, which emits a
          # different JSON export shape. That makes this runner a free
          # real-world test that the version gate rejects it.
          - os: ubuntu-latest
            install: sudo apt-get update && sudo apt-get install -y ncdu
            expect: unsupported
          # Homebrew ships ncdu 2.x, so this is the usable-backend case.
          - os: macos-latest
            install: brew install ncdu
            expect: ok
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1

      - name: Install ncdu
        run: ${{ matrix.install }}

      - name: Report installed ncdu
        run: ncdu --version

      # `backends` exits non-zero when nothing usable is found, so the exit
      # code is asserted explicitly per platform rather than assumed.
      - name: Detect backends
        run: |
          set +e
          output=$(cargo run -q -p nirmoka-cli -- backends)
          status=$?
          set -e

          printf '%s\n' "$output"
          echo "exit status: $status"

          case "${{ matrix.expect }}" in
            ok)
              if [ "$status" -ne 0 ]; then
                echo "::error::expected a usable backend, got exit $status"
                exit 1
              fi
              if ! printf '%s' "$output" | grep -qE '^ncdu +ok +2\.'; then
                echo "::error::expected ncdu reported as ok at 2.x"
                exit 1
              fi
              ;;
            unsupported)
              if [ "$status" -eq 0 ]; then
                echo "::error::ncdu 1.x must not be accepted — the version gate failed"
                exit 1
              fi
              if ! printf '%s' "$output" | grep -q 'unsupported'; then
                echo "::error::expected ncdu reported as unsupported"
                exit 1
              fi
              ;;
          esac

      - name: Detect backends as JSON
        run: cargo run -q -p nirmoka-cli -- backends --json || true

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build

  # Architectural invariants. The checks live in scripts/check-invariants.sh so
  # that this job and the pre-push hook run the exact same code and cannot drift.
  invariants:
    name: architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-invariants.sh
