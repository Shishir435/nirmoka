[workspace]
resolver = "2"
members = ["crates/*", "tests/contract"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Shishir435/nirmoka"
authors = ["Shishir435 <shishirchaurasiya435@gmail.com>"]

[workspace.dependencies]
# Internal crates. `core` deliberately depends on nothing internal.
nirmoka-core = { path = "crates/core" }
nirmoka-adapter = { path = "crates/adapter" }
nirmoka-adapter-ncdu = { path = "crates/adapter-ncdu" }
nirmoka-adapter-mole = { path = "crates/adapter-mole" }
nirmoka-adapter-gdu = { path = "crates/adapter-gdu" }
nirmoka-adapter-rip = { path = "crates/adapter-rip" }

# External. Keep this list short; every addition is a maintenance cost.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Shell-only. Confined to crates/app by invariant 1 — nothing else in the
# workspace may depend on these, and crates/cli exists to prove it.
tauri = "2"
tauri-build = "2"

# The platform's own Trash service — the one Finder uses on macOS, the Recycle
# Bin on Windows, the freedesktop specification elsewhere. Shell-only, like
# tauri, because moving a selected path to the Trash is a platform integration
# rather than a backend ability (ADR 0025). The alternative was `osascript`
# driving Finder's UI scripting layer, or making the product's central verb
# depend on `brew install trash`. Default features off: they only add `chrono`,
# for listing trash contents, which macOS does not support and Nirmoka does not
# do.
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }

# Generates the TypeScript mirrors of the boundary types. A hand-maintained
# mirror of a Rust struct drifts silently; that is the whole problem here.
ts-rs = "12"

# Reads `Contents/Info.plist` for `CFBundleIdentifier`, which is the key every
# application footprint is assembled from — see ADR 0028. A bundle's Info.plist
# is binary as often as it is XML, so hand-parsing would mean implementing
# Apple's bplist00 container; `defaults read` would mean a subprocess per app,
# on a dashboard that lists forty of them. Shell-only, like tauri: nothing but
# crates/app has an application bundle to read.
plist = "1"

# Finds the user's home directory. Invariant 3: home, cache, and config
# directories come from here, never from a `~/Library` or `/Users/` literal —
# a literal is a path that only exists on the machine it was written on.
directories = "6"

[profile.release]
strip = true
lto = true
codegen-units = 1
