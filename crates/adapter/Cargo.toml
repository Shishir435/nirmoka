[package]
name = "nirmoka-adapter"
description = "Backend adapter contract for Nirmoka. Trait and capabilities only, no implementations."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# This crate must not depend on any concrete `nirmoka-adapter-*` crate — that
# would be a dependency cycle. Concrete adapters are assembled into a Registry
# by whoever owns `main` (nirmoka-cli today, the Tauri app later).
[dependencies]
nirmoka-core = { workspace = true }
serde = { workspace = true }
# The wire format is part of the contract, so its parser lives here rather than
# in one adapter that the others would have to depend on. See docs/adr/0008.
# `unbounded_depth` because serde_json stops at 128 levels of nesting and real
# directory trees go deeper; crate::wire enforces its own limit instead.
serde_json = { workspace = true }
thiserror = { workspace = true }
