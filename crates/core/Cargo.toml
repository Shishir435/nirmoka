[package]
name = "nirmoka-core"
description = "Nirmoka domain model and policy. Framework- and backend-independent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published to crates.io. These crates depend on each other by path with no
# version, so `cargo publish` would refuse them as they stand; saying so here
# makes that explicit rather than a discovery, and stops an accidental publish.
# Reversible: give the workspace path dependencies versions and drop this line.
publish = false

# INVARIANT: this crate must never depend on `tauri`, on any `nirmoka-adapter*`
# crate, or on any GUI framework. It is the piece that survives swapping either
# side. CI enforces this — see .github/workflows/ci.yml.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
