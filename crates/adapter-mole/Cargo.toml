[package]
name = "nirmoka-adapter-mole"
description = "Mole backend adapter. macOS-only cleanup abilities; not a scanner."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published to crates.io. These crates depend on each other by path with no
# version, so `cargo publish` would refuse them as they stand; saying so here
# makes that explicit rather than a discovery, and stops an accidental publish.
# Reversible: give the workspace path dependencies versions and drop this line.
publish = false

[dependencies]
directories = { workspace = true }
nirmoka-adapter = { workspace = true }
nirmoka-core = { workspace = true }
# Mole's supported status and application-list boundaries are JSON; parsing stays here.
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
